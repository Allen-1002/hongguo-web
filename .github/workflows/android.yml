name: android

# 构建安卓 APK：内嵌 nodejs-mobile（Node 18）运行 server/，WebView 打开本机页面。
# push 到 main / android-app、手动触发都会出 APK（在 Actions 运行页的 Artifacts 里下载）；
# 打 v* 标签时额外把 APK 挂到 GitHub Release。
on:
  push:
    branches: [main, android-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 手机里跑的是 Node 18，自测用 Node 18 再跑一遍，提前发现用了新版才有的 API。
      - name: Selftest on Node 22 and Node 18
        run: |
          set -eu
          npm --prefix server install --omit=dev --no-audit --no-fund
          npm --prefix server run selftest
          npx -y node@18.20.4 server/selftest.mjs
          rm -rf server/node_modules

      # 必须是平铺的 node_modules：pnpm 默认用符号链接，打进 zip 后链接变成普通目录，
      # axios 的依赖（form-data 等）就找不到了，App 一启动 Node 就退出（真机实测）。
      - name: Install server deps (production, hoisted)
        run: |
          set -eu
          corepack enable
          cd server && pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
          test -f node_modules/form-data/package.json
          test -z "$(find node_modules -type l -not -path '*/.bin/*' | head -1)" || { echo "node_modules 里还有符号链接"; find node_modules -type l | head; exit 1; }

      - name: Cache nodejs-mobile
        uses: actions/cache@v4
        with:
          path: android/app/libnode
          key: nodejs-mobile-18.20.4-android

      - name: Fetch nodejs-mobile
        run: android/scripts/fetch-libnode.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 没配正式签名时用调试签名；把调试 keystore 缓存起来，
      # 否则每次构建换一把钥匙，装新版要先卸载（本机数据会丢）。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          set -eu
          version="$(node -p "require('./server/package.json').version")"
          out="hongguo-${version}-${GITHUB_RUN_NUMBER}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          ls -la "$out"
          # 确认原生库和 Node 项目都打进去了（缺 libc++_shared.so / libnode.so 会一启动就闪退）
          unzip -l "$out" | grep -E "lib/|assets/" 
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # 用和手机一样的 Node 18，从 APK 里解出的 nodejs-project 真启动一次手机模式，确认能起来。
      - name: Boot bundled server on Node 18 (smoke)
        run: |
          set -eu
          dir="$RUNNER_TEMP/bundle"
          mkdir -p "$dir"
          unzip -q -p "${{ steps.apk.outputs.file }}" assets/nodejs-project.zip > "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$dir"
          MOBILE=1 PORT=38799 TOKEN=ci DATA_DIR="$RUNNER_TEMP/data" SOURCES_DIR="$dir/sources/builtin" \
            HONGGUO_LOG_FILE="$RUNNER_TEMP/node.log" \
            npx -y node@18.20.4 "$dir/server/mobile-boot.cjs" &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:38799/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/health.json" || true; echo
          cat "$RUNNER_TEMP/node.log" || true
          kill $pid || true
          grep -q '"mobile":true' "$RUNNER_TEMP/health.json"

      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-android
          path: ${{ steps.apk.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
